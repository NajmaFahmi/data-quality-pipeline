name: Contract Validation

on:
  push:
    paths:
      - "mini_project/contracts/**"
      - "mini_project/src/contract_loader.py"
      - "mini_project/src/contract_enforcer.py"
      - "mini_project/tests/test_contract_loader.py"
  pull_request:
    paths:
      - "mini_project/contracts/**"
      - "mini_project/src/contract_loader.py"
      - "mini_project/src/contract_enforcer.py"
      - "mini_project/tests/test_contract_loader.py"

jobs:
  validate-contract:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        pip install pytest pyyaml
    
    - name: Run contract validation tests
      run: |
        cd mini_project
        pytest tests/test_contract_loader.py -v